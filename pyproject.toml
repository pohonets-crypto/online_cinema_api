    "anyio (>=4.12.1,<5.0.0)",
    "asgiref (>=3.11.1,<4.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "click (>=8.3.1,<9.0.0)",
    "six (>=1.17.0,<2.0.0)",
